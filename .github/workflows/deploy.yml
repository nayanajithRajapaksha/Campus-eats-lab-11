name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            secret: RENDER_FRONTEND_SERVICE_ID
            url: https://campuseats-web-sffl.onrender.com
          - name: backend
            secret: RENDER_BACKEND_SERVICE_ID
            url: https://campuseats-api-qpp8.onrender.com

    environment:
      name: production-${{ matrix.name }}
      url: ${{ matrix.url }}

    steps:
      - name: Deploy and wait for Render
        env:
          API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets[matrix.secret] }}
        shell: bash
        run: |
          set -euo pipefail
          : "${API_KEY:?Missing RENDER_API_KEY}"
          : "${SERVICE_ID:?Missing Render service ID}"

          base="https://api.render.com/v1/services/$SERVICE_ID/deploys"
          payload=$(jq -n --arg sha "$GITHUB_SHA" '{commitId: $sha}')

          response=$(curl --fail --silent --show-error \
            --max-time 60 \
            -X POST "$base" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")

          deploy_id=$(jq -er '.id' <<< "$response")

          for attempt in $(seq 1 150); do
            response=$(curl --fail --silent --show-error \
              --max-time 30 --retry 3 \
              -H "Authorization: Bearer $API_KEY" \
              "$base/$deploy_id")

            status=$(jq -er '.status' <<< "$response")
            echo "Render deployment: $status"

            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Render."
          exit 1
